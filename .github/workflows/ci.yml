name: CI
on:
  pull_request: {}
  push: { branches: [main] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:plugins -- --check
      - run: git diff --exit-code
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:sync
      - run: npm run test:unit:built
      - run: npm run test:extension
      - run: npm run test:smoke:built
      - run: npm run verify --workspace @manifold3d/copilot-extension
      - run: npm run verify:viewer-flat
