name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing auto-provenance needs npm >= 11.5.1. Pin a floor so
      # the toolchain is reproducible and provenance is guaranteed.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      # Fail fast if the pushed tag does not match the version being published,
      # so a typo'd tag can never publish the wrong version.
      - name: Verify tag matches public package version
        run: |
          PKG="v$(node -p "require('./packages/manifold3d-mcp/package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/manifold3d-mcp/package.json version ($PKG)"
            exit 1
          fi

      # Defense in depth: refuse to publish a release whose manifests / skill
      # docs have drifted (prepublishOnly also runs this).
      - run: npm run check:sync

      # OIDC Trusted Publishing generates provenance automatically (npm >=
      # 11.5.1), so no NPM_TOKEN and no --provenance flag are needed.
      - run: npm publish --workspace @zhicwan/manifold3d-mcp

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
